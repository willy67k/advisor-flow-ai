services:
  db:
    build:
      context: ./infra/docker/db
      dockerfile: Dockerfile
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-advisorflow}
      POSTGRES_USER: ${POSTGRES_USER:-advisorflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-advisorflow}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - advisorflow_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-advisorflow} -d ${POSTGRES_DB:-advisorflow}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  advisorflow_pgdata:
