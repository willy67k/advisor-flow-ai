# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
      - id: check-yaml
      - id: check-added-large-files

  # Python Backend Linting & Formatting (Ruff)
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.3.4
    hooks:
      - id: ruff
        args: [ --fix ]
        files: ^packages/backend/
      - id: ruff-format
        files: ^packages/backend/

  # Frontend — use the same Prettier + plugins as `yarn format` (packages/frontend).
  # mirrors-prettier is archived and pins an old Prettier without workspace plugins.
  - repo: local
    hooks:
      - id: frontend-prettier
        name: Prettier (packages/frontend, same as yarn format)
        language: system
        entry: node ./node_modules/prettier/bin/prettier.cjs --write
        types_or: [html, javascript, jsx, ts, tsx, json, css, scss, markdown]
        files: ^packages/frontend/
